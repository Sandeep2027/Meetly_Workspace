<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetly · Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--rail:#0e1621;--bg:#eef1f6;--card:#fff;--line:#e3e8ef;--tx:#101828;--mut:#667085;--ac:#4f46e5;--ac2:#eef0ff;--ok:#12b76a;--bad:#f04438;--warn:#f79009;--r:12px;--sh:0 1px 2px #1018280d,0 6px 18px #1018280a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14.5px/1.5 Manrope,system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;transition:background .12s,border-color .12s}
button:hover{border-color:#c5cdd8;background:#f9fafb}button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button.pri:hover{background:#4338ca}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}button.sm{padding:4px 10px;font-size:13px}button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}h1,h2,h3{margin:0}h1{font-size:26px;font-weight:800}h3{font-size:15.5px;font-weight:700}
.mut{color:var(--mut)}small{font-size:12.5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:20px;background:var(--ac2);color:var(--ac)}.tag.off{background:#fde8e6;color:var(--bad)}.tag.ok{background:#dcf5ea;color:#0b7a4b}
.ib{width:38px;height:38px;padding:0;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:var(--mut)}.ib:hover{background:#f0f2f6;color:var(--tx)}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;position:relative}.pd{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#98a2b3;border:2px solid #fff}.pd.on{background:var(--ok)}
.badge{background:var(--ac);color:#fff;border-radius:20px;font-size:11.5px;font-weight:700;padding:0 7px;min-width:20px;text-align:center}
/* shell */
#app{height:100dvh;display:grid;grid-template-columns:72px 1fr}#app.hp{grid-template-columns:72px 350px 1fr}
#rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;color:#8b98a9}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7c74ff,#4f46e5);display:grid;place-items:center;color:#fff;margin-bottom:12px}
.rb{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:0;background:none;color:inherit;padding:0}.rb:hover{background:#ffffff14;color:#fff}.rb.on{background:var(--ac);color:#fff}
.rb .badge{position:absolute;top:1px;right:-2px;font-size:10.5px;padding:0 5px;min-width:18px;border:2px solid var(--rail)}.sp{flex:1}
#panel{display:none;background:#fff;border-right:1px solid var(--line);flex-direction:column;min-height:0}#app.hp #panel{display:flex}
.ph{padding:18px 16px 8px}.ph .row{margin-bottom:12px}
.srch{position:relative}.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}.srch input{padding-left:36px;background:#f4f6f9;border-color:transparent}
.chips{display:flex;gap:6px;margin-top:10px}.chips button{padding:4px 12px;border-radius:20px;font-size:13px;background:#f4f6f9;border-color:transparent;color:var(--mut)}.chips button.on{background:var(--ac2);color:var(--ac)}
#list{overflow:auto;flex:1;padding:4px 8px 12px}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;border:0;width:100%;background:none;text-align:left}.ci:hover{background:#f5f7fa}.ci.on{background:var(--ac2)}
.ci b{font-size:14.5px}.ci small{color:var(--mut)}.ci .tm{font-size:12px;color:var(--mut);text-align:right}.ci .tm.u{color:var(--ac);font-weight:700}
main{display:flex;flex-direction:column;min-width:0;min-height:0}#view{flex:1;min-height:0;overflow:auto}#view.chatv{overflow:hidden;display:flex}
.page{padding:28px 32px 40px;max-width:1180px;margin:0 auto;width:100%}.ph2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{display:flex;gap:14px;align-items:center}.stat i{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--ac2);color:var(--ac);flex:none}.stat b{display:block;font-size:26px;line-height:1.1;font-weight:800}.stat span{color:var(--mut);font-size:13px}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.qa button{display:flex;gap:12px;align-items:center;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh)}.qa button:hover{border-color:var(--ac)}.qa i{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}.qa small{display:block;font-weight:500;color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{font-weight:600;color:var(--mut);font-size:12.5px;background:#fafbfc}tr:last-child td{border-bottom:0}
.tw{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:var(--sh)}.tw td:last-child{white-space:nowrap}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{width:auto;min-width:220px}
.tabs{display:flex;gap:4px;background:#e4e8ef;border-radius:12px;padding:4px;margin-bottom:22px;flex-wrap:wrap;width:fit-content}.tabs button{border:0;background:none;color:var(--mut)}.tabs button.on{background:#fff;color:var(--ac);box-shadow:0 1px 3px #1018281a}
.bars{display:flex;gap:12px;align-items:flex-end;height:150px;margin-top:12px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.bars i{display:block;background:linear-gradient(#7c74ff,#4f46e5);border-radius:6px 6px 0 0;min-height:3px;margin:2px 0}
/* chat */
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:#e9edf3}
.chd{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center}.chd .back{display:none}
#msgs{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:#fff;color:var(--mut);font-size:12px;font-weight:600;padding:3px 12px;border-radius:20px;margin:12px 0 6px;box-shadow:var(--sh)}
.sysm{align-self:center;background:#ffffffb0;color:var(--mut);font-size:12.5px;padding:2px 12px;border-radius:20px;margin:4px 0}
.mr{display:flex;gap:8px;align-items:flex-start;max-width:100%;position:relative;padding:1px 0}.mr.mine{flex-direction:row-reverse}
.bub{max-width:min(560px,78%);background:#fff;border-radius:14px 14px 14px 4px;padding:7px 11px 5px;box-shadow:0 1px 1px #1018280d;min-width:70px}.mine .bub{background:#dfe3ff;border-radius:14px 14px 4px 14px}
.who{font-size:12.5px;font-weight:700;margin-bottom:1px}.txt{white-space:pre-wrap;word-break:break-word}.txt a{color:var(--ac)}
.meta{font-size:11px;color:var(--mut);text-align:right;margin-top:1px;white-space:nowrap}.tk{margin-left:4px;letter-spacing:-2px}.tk.seen{color:#2f80ed}
.del .txt{color:var(--mut);font-style:italic}
.quote{border-left:3px solid var(--ac);background:#0000000a;border-radius:6px;padding:4px 9px;margin-bottom:5px;cursor:pointer;font-size:13px}.quote b{display:block;color:var(--ac);font-size:12.5px}.quote span{display:block;color:var(--mut);max-height:36px;overflow:hidden}
.fimg{display:block;max-width:100%;max-height:300px;border-radius:9px;margin-bottom:4px}audio{max-width:100%;height:40px;margin-bottom:4px}
.fdoc{display:flex;gap:10px;align-items:center;background:#0000000a;border-radius:10px;padding:9px 11px;color:inherit;text-decoration:none;margin-bottom:4px;min-width:220px}.fdoc:hover{background:#00000012}.fdoc .fi{width:40px;height:40px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}.fdoc b{display:block;font-size:13.5px;word-break:break-all}.fdoc small{color:var(--mut)}
.rxs{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.rx{padding:0 7px;font-size:12.5px;border-radius:20px;background:#fff;border:1px solid var(--line);font-weight:600}.mine .rx{background:#fff}.rx.me{border-color:var(--ac);background:var(--ac2)}
.tools{display:none;align-self:center;gap:2px;background:#fff;border-radius:20px;padding:2px 4px;box-shadow:var(--sh)}.mr:hover .tools{display:flex}.tools button{border:0;background:none;padding:2px 5px;color:var(--mut);border-radius:50%}.tools button:hover{color:var(--ac);background:var(--ac2)}
.flash .bub{animation:fl 1.2s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--ac)}}
.typ{padding:0 24px 4px;font-size:12.5px;color:var(--mut);min-height:22px}
.upl{padding:0 16px}.upc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}.pg{height:5px;background:#e4e8ef;border-radius:3px;overflow:hidden;margin-top:4px}.pg i{display:block;height:100%;background:var(--ac)}
.rb2{margin:0 16px 6px;background:#fff;border-left:4px solid var(--ac);border-radius:10px;padding:7px 12px;display:flex;gap:8px;align-items:center}
.comp{display:flex;gap:6px;padding:10px 16px 14px;align-items:flex-end}.comp textarea{resize:none;max-height:140px;min-height:42px;border-radius:22px;padding:10px 16px}
.send{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
.emo{margin:0 16px 6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(10,1fr);font-size:21px;box-shadow:var(--sh)}.emo button{border:0;background:none;padding:3px}.emo button:hover{background:var(--ac2)}
.drop{position:absolute;inset:0;background:#4f46e5d9;color:#fff;display:none;place-items:center;font-size:22px;font-weight:800;z-index:4;border:3px dashed #fff}.drop.on{display:grid}
.cinfo{width:330px;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:18px;flex:none}
#pop{position:fixed;z-index:45;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px #10182826;padding:6px;display:none;min-width:190px}#pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;font-weight:500}#pop button:hover{background:#f4f6f9}#pop .rr{display:flex;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}#pop .rr button{width:auto;font-size:20px;padding:2px 5px}
.empty{margin:auto;text-align:center;max-width:380px;color:var(--mut);padding:30px}
#mini{position:fixed;right:18px;bottom:18px;z-index:24;background:#0b1020;color:#fff;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 34px #0007}#mini[hidden]{display:none}
#mini .mb{color:#fff;background:#ffffff1f}#mini .mb.off{background:#fff;color:#0b1020}#mini .mb.bad{background:var(--bad)}.dotl{width:10px;height:10px;border-radius:50%;background:#31d08f;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.35}}
#notes{position:fixed;top:16px;right:16px;z-index:46;display:grid;gap:10px;width:min(360px,calc(100vw - 32px))}.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px #10182830}
.avs{display:flex}.avs .av{margin-left:-8px;border:2px solid #fff}.avs .av:first-child{margin-left:0}.trunc2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 8px}
/* modal + misc */
#modal{position:fixed;inset:0;background:#0a0f24b3;display:none;place-items:center;z-index:40;padding:16px}#modal.on{display:grid}
.box{background:#fff;border-radius:18px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}.box.wide{width:min(780px,100%)}.box h2{font-size:20px;margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g2 .full{grid-column:1/-1}.err{color:var(--bad);font-size:13px;min-height:20px;margin:6px 0}
.chk{display:flex;gap:9px;align-items:center;padding:5px 0;margin:0;font-weight:500}.chk input{width:auto}.checks{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.code{font-family:ui-monospace,monospace;background:var(--ac2);color:var(--ac);padding:8px 12px;border-radius:9px;display:inline-block;font-size:16px;font-weight:600;user-select:all}
.cr{border:1px solid var(--line);border-radius:12px;margin:14px 0}.cr div{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13.5px}.cr div:last-child{border:0}.cr span{color:var(--mut)}
.warn{background:#fff6e5;border:1px solid #fde3b0;color:#8a5a00;border-radius:10px;padding:9px 12px;font-size:13px;margin:10px 0}.full-btn{width:100%;margin-top:8px;padding:11px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 18px;border-radius:12px;display:none;z-index:50;font-weight:500}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.thumbs div{width:92px;text-align:center;font-size:11.5px;word-break:break-all}.thumbs img{width:92px;height:72px;object-fit:cover;border-radius:10px;display:block}.thumbs .ph3{width:92px;height:72px;border-radius:10px;background:var(--ac2);color:var(--ac);display:grid;place-items:center}
@media(max-width:860px){#mini{bottom:70px}#app,#app.hp{grid-template-columns:1fr;grid-template-rows:1fr 58px}#rail{grid-row:2;flex-direction:row;justify-content:space-around;padding:4px}.logo,.sp{display:none}
 #app.hp #panel{grid-row:1}#app.hp main{display:none}#app.hp.inroom #panel{display:none}#app.hp.inroom main{display:flex}.chd .back{display:grid}.cinfo{position:absolute;inset:0;width:auto;z-index:6}.page{padding:18px 14px}.g2{grid-template-columns:1fr}.bub{max-width:88%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app" hidden></div><div id="mini" hidden></div><div id="notes"></div><div id="modal"></div><div id="pop"></div><div id="toast"></div>
<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICONS={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',reply:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',

min:'<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>',layout:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>',

async function api(p,method='GET',body){
  const r=await fetch('/api'+p,{method,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:body?JSON.stringify(body):undefined});
  if(r.headers.get('content-type')?.includes('text/csv'))return r.blob();
  const d=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401)logout();throw new Error(typeof d.detail==='string'?d.detail:(d.detail?.[0]?.msg||'Request failed'))}return d}

    else if(f.list)i=`<div class="checks">${f.list.length>3?`<button type="button" class="sm" style="margin:6px 0" onclick="const b=[...this.parentElement.querySelectorAll('input')],all=b.every(x=>x.checked);b.forEach(x=>x.checked=!all)">Select all / none</button>`:''}${f.list.map(([a,b,s,k])=>`<label class="chk"><input type="checkbox" name="${f.n}" value="${a}" ${k?'checked':''}> ${esc(b)} <span class="mut">${esc(s||'')}</span></label>`).join('')||'<span class="mut">No one available</span>'}</div>`;
    else i=`<input name="${f.n}" type="${f.t||'text'}" value="${esc(v)}" ${f.req?'required':''} ${f.min?`minlength="${f.min}"`:''}>`;
    return `<div class="${f.full?'full':''}"><label>${f.l}</label>${i}</div>`};
  modal(`<h2>${o.title}</h2>${o.intro?`<p class="mut" style="margin:4px 0 0">${o.intro}</p>`:''}<form id="mf"><div class="g2">${o.fields.map(fld).join('')}</div><div class="err"></div><div class="row"><button class="pri">${o.submit||'Save'}</button><button type="button" onclick="closeModal()">Cancel</button></div></form>`,o.wide);
  $('#mf').onsubmit=async e=>{e.preventDefault();const f=e.target,d={};
    for(const el of f.elements){if(!el.name)continue;if(el.type==='checkbox'){if(el.checked)(d[el.name]??=[]).push(el.value)}else d[el.name]=el.value}
    const b=f.querySelector('.pri');b.disabled=true;try{await o.onSubmit(d)}catch(x){f.querySelector('.err').textContent=x.message;b.disabled=false}}}

function convs(){const L=[];
  S.users.filter(u=>u.id!==S.me.id).forEach(u=>L.push({id:dmId(u.id),kind:'dm',name:u.name,sub:u.role,uid:u.id,online:u.online}));
  S.teams.forEach(t=>{L.push({id:t.room,kind:'team',name:t.name,sub:t.department+' team'});t.spaces.forEach(s=>L.push({id:s.id,kind:'space',name:s.name,sub:'Space in '+t.name}))});
  S.calls.forEach(c=>L.push({id:c.id,kind:'call',name:c.title,sub:c.members.length+' people'}));
  L.forEach(x=>{x.last=S.last[x.id];x.ts=x.last?.ts||0;x.un=S.unread[x.id]||0});
  return L.sort((a,b)=>b.ts-a.ts||a.name.localeCompare(b.name))}
function renderPanel(){
  if(S.sec!=='chats')return;const q=S.cq.toLowerCase();
  const L=convs().filter(x=>(S.cf==='all'||(S.cf==='unread'&&x.un)||(S.cf==='groups'&&x.kind!=='dm'))&&(x.name+x.sub).toLowerCase().includes(q));
  const prev=x=>x.last?`${x.last.user===S.me.id&&!x.last.system?'You: ':''}${x.last.file&&!x.last.text?'📎 Attachment':esc(x.last.text)}`:esc(x.sub);
  $('#panel').innerHTML=`<div class="ph"><div class="row"><h1 class="grow" style="font-size:22px">Chats</h1><button class="ib pb" title="New group, meeting or team" onclick="newMenu(event)">${ic('plus')}</button></div>

  <div id="list">${L.map(x=>`<button class="ci ${S.room===x.id?'on':''}" onclick="${x.kind==='dm'?`openDM('${x.uid}')`:`go('#/chats/${x.id}')`}">${x.kind==='dm'?av(x.name,x.uid,46,x.online):gav(x.name,x.id,46)}<span class="grow"><b class="trunc" style="display:block">${esc(x.name)}</b><small class="trunc" style="display:block">${prev(x)}</small></span><span class="tm ${x.un?'u':''}">${shortTime(x.ts)}${x.un?`<br><span class="badge">${x.un}</span>`:''}</span></button>`).join('')||'<div class="empty">No conversations match</div>'}</div>`}
async function route(){

  $('#app').classList.toggle('hp',S.sec==='chats');$('#app').classList.toggle('inroom',S.sec==='chats'&&!!p[1]);
  if(S.sec==='chats'){renderPanel();if(p[1])await openRoom(p[1]);else{S.room=null;S.rinfo=null;view(`<div class="empty"><h3>Select a conversation</h3><p>Choose a person, team or call from the list, or start a new group call.</p></div>`)}}
  else{S.room=null;S.rinfo=null;const key=S.sec==='admin'?'admin/'+(p[1]||'dashboard'):S.sec;if(key.startsWith('admin')&&!isAdm())return go('#/dashboard');
    try{await(pages[key]||pages.dashboard)()}catch(e){view(`<div class="empty"><h3>Something went wrong</h3><p>${esc(e.message)}</p></div>`)}}
  renderRail()}
async function openDM(id){try{const d=await api('/dm/'+id);go('#/chats/'+d.id)}catch(e){toast(e.message)}}

/* ================= CHAT ================= */
async function openRoom(id){
  try{const r=await api('/rooms/'+id),d=await api(`/rooms/${id}/messages`);
    S.msgs=d.messages;S.peerRead=d.peer_read;S.more=d.messages.length>=50;S.room=id;S.replyTo=null;S.up=[];
    const dm=r.kind==='dm'?r.members.find(x=>x!==S.me.id):null,team=S.teams.find(t=>t.id===r.team_id);
    S.rinfo={id,kind:r.kind,dm,team:team?.id,owner:r.owner_id,name:r.kind==='dm'?uname(dm):r.title,desc:r.description,expires:r.expires,sched:r.scheduled_at,members:r.members,rm:r};
    $('#view').className='chatv';
    $('#view').innerHTML=`<div class="cmain" id="cmain"><div class="drop" id="drop">Drop files to send (up to 50 MB each)</div><div class="chd" id="chd"></div><div id="sbw" style="display:none;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line)"><input id="sq" placeholder="Search in this chat" oninput="searchRoom(this.value)"></div><div id="msgs"></div><div class="typ" id="typ"></div><div class="upl" id="upl"></div><div id="rb"></div><div id="emo"></div>
      <div class="comp"><input type="file" id="fi" multiple hidden onchange="attachModal([...this.files]);this.value=''"><button class="ib" title="Attach files" onclick="$('#fi').click()">${ic('clip')}</button><button class="ib" title="Emoji" onclick="toggleEmo()">${ic('smile')}</button><textarea id="txt" rows="1" placeholder="Type a message" maxlength="4000" oninput="grow(this);typingPing()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}" onpaste="pasteFiles(event)"></textarea><button class="pri send" title="Send" onclick="sendChat()">${ic('send',20)}</button></div></div><div class="cinfo" id="info" hidden></div>`;
    const cm=$('#cmain');['dragenter','dragover'].forEach(ev=>cm.addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('on')}));
    cm.addEventListener('dragleave',e=>{if(e.target.id==='drop')$('#drop').classList.remove('on')});cm.addEventListener('drop',e=>{e.preventDefault();$('#drop').classList.remove('on');if(e.dataTransfer.files.length)attachModal([...e.dataTransfer.files])});
    drawChatHead();drawMsgs(true);send({t:'open',room:id});markRead();renderPanel()}
  catch(e){S.room=null;view(`<div class="empty"><h3>Cannot open this conversation</h3><p>${esc(e.message)}</p><button onclick="go('#/dashboard')">Back to dashboard</button></div>`)}}
const grow=t=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'};
function chatSub(){const r=S.rinfo,n=S.counts[r.id]||0,c=n?` · ${n} in call`:'';
  if(r.kind==='dm'){const u=S.users.find(x=>x.id===r.dm);return(u?.online?'Online':'Offline')+' · '+esc(u?.role||'')+c}
  return{team:()=>`Team chat · ${S.teams.find(t=>t.id===r.team)?.members.length||''} members`,space:()=>`Temporary space${r.expires?' · closes '+fmtTs(r.expires):''}`,meeting:()=>mWhen(r.rm)+' · code '+r.id,call:()=>`Group · ${r.members.length} members`}[r.kind]()+c}
function drawChatHead(){if(!S.rinfo||!$('#chd'))return;const r=S.rinfo,n=S.counts[r.id]||0,inCall=!!(cb&&cb.room===r.id),u=S.users.find(x=>x.id===r.dm),grp=['call','team','space'].includes(r.kind);
  const callBtn=inCall?`<button class="pri" onclick="openCallWindow('${r.id}')">${ic('min',17)} Return to call</button><button class="bad" onclick="callCmd('leave')">Leave</button>`:r.kind==='meeting'?`<button class="pri" onclick="joinCall('${r.id}',false)">${ic('video',17)} ${n?'Join meeting':'Start meeting'}</button>`:`<button class="pri" onclick="joinCall('${r.id}',${n?'false':'true'})">${ic('phone',17)} ${n?'Join call':'Voice call'}</button>${grp?`<button onclick="meetFromRoom()">${ic('video',17)} Meeting</button>`:''}`;
  $('#chd').innerHTML=`<button class="ib back" onclick="go('#/chats')">${ic('back')}</button>${r.kind==='dm'?av(r.name,r.dm,42,u?.online):gav(r.name,r.id,42)}<div class="grow"><b>${esc(r.name)}</b><br><small class="mut trunc" style="display:block">${chatSub()}</small></div>${callBtn}<button class="ib" title="Search" onclick="toggleSearch()">${ic('search')}</button><button class="ib" title="Info" onclick="toggleInfo()">${ic('info')}</button><button class="ib pb" onclick="chatMenu(event)">${ic('more')}</button>`}
function toggleSearch(){const w=$('#sbw');w.style.display=w.style.display==='none'?'block':'none';if(w.style.display==='block')$('#sq').focus();else{$('#sq').value='';searchRoom('')}}
function canClearAll(){const r=S.rinfo,t=S.teams.find(x=>x.id===r.team);return r.kind!=='dm'&&(isAdm()||r.owner===S.me.id||t?.owner===S.me.id)}
function chatMenu(e){const r=S.rinfo;pop(`<button onclick="toggleInfo()">${ic('info',17)} Chat info</button>${['call','team','space'].includes(r.kind)?`<button onclick="meetFromRoom()">${ic('cal',17)} Schedule a meeting</button>`:''}${r.kind==='meeting'?`<button onclick="copy(location.origin+'/call/${r.id}')">${ic('copy',17)} Copy invite link</button>`:''}${r.kind==='team'?`<button onclick="teamManage('${r.team}')">${ic('users',17)} Members</button><button onclick="spaceForm('${r.team}')">${ic('plus',17)} New space</button>`:''}${r.kind==='space'&&(r.owner===S.me.id||isAdm())?`<button onclick="closeSpace('${r.id}')">${ic('x',17)} Close space</button>`:''}${r.kind==='call'?`<button onclick="hidePop();leaveGroup()">${ic('out',17)} Leave group</button>`:''}<button onclick="clearChat()">${ic('trash',17)} Clear chat</button>`,e)}
async function closeSpace(id){hidePop();if(!confirm('Close this space and delete its chat and files?'))return;try{await api('/spaces/'+id,'DELETE');await refresh();go('#/teams')}catch(e){toast(e.message)}}
function clearChat(){hidePop();modal(`<h2>Clear chat</h2><p class="mut">Choose how to clear <b>${esc(S.rinfo.name)}</b>.</p><div style="display:grid;gap:8px"><button onclick="doClear('me')">Clear for me only<br><small class="mut">Others keep their messages and files.</small></button>${canClearAll()?`<button class="bad" onclick="doClear('all')">Clear for everyone<br><small>Deletes all messages and files permanently.</small></button>`:''}<button onclick="closeModal()">Cancel</button></div>`)}
async function doClear(scope){try{await api(`/rooms/${S.room}/clear`,'POST',{scope});closeModal();if(scope==='me'){S.msgs=[];S.more=false;S.last[S.room]=undefined;drawMsgs(true);renderPanel()}toast('Chat cleared')}catch(e){toast(e.message)}}
async function toggleInfo(){hidePop();const i=$('#info');if(!i.hidden){i.hidden=true;return}i.hidden=false;
  const r=S.rinfo,members=r.kind==='dm'?[S.me.id,r.dm]:r.kind==='team'||r.kind==='space'?(S.teams.find(t=>t.id===r.team)?.members||[]):r.kind==='call'?r.members:(S.meetings.find(m=>m.id===r.id)?.invitees||[]);
  i.innerHTML='<p class="mut">Loading…</p>';let files=[];try{files=await api(`/rooms/${S.room}/files`)}catch{}
  i.innerHTML=`<div style="text-align:center">${r.kind==='dm'?av(r.name,r.dm,80):gav(r.name,r.id,80)}<h3 style="margin-top:10px">${esc(r.name)}</h3><small class="mut">${chatSub()}</small></div>${r.desc?`<p style="white-space:pre-wrap">${esc(r.desc)}</p>`:''}
  ${grpMgr()?`<div class="row" style="margin-top:12px"><button class="sm" onclick="addGroupMembers()">${ic('adduser',15)} Add members</button><button class="sm" onclick="renameGroup()">Rename</button></div>`:''}
  ${members.length?`<h3 style="margin:20px 0 6px">${r.kind==='meeting'?'Invited':'Members'} (${members.length})</h3>${members.map(m=>`<div class="li">${av(uname(m),m,34)}<span class="grow">${esc(uname(m))}${m===r.owner?' <span class="tag">Owner</span>':''}<br><small class="mut">${esc(S.users.find(u=>u.id===m)?.role||'')}</small></span>${grpMgr()&&m!==S.me.id?`<button class="ib" title="Remove" onclick="removeMember('${m}')">${ic('x',17)}</button>`:''}</div>`).join('')}`:''}
  <h3 style="margin:20px 0 6px">Files and media (${files.length})</h3>${files.map(f=>`<a class="fdoc" href="/api/files/${f.id}?token=${S.token}" download="${esc(f.name)}"><span class="fi">${ic('file',20)}</span><span class="grow"><b>${esc(f.name)}</b><small>${fmtSize(f.size)} · ${esc(uname(f.user_id))}</small></span></a>`).join('')||'<p class="mut">Nothing shared yet.</p>'}
  <p style="margin-top:18px"><button onclick="clearChat()">${ic('trash',16)} Clear chat</button> <button onclick="$('#info').hidden=true">Close</button></p>`}
function fileHtml(f){if(!f)return'';const u=`/api/files/${f.id}?token=${S.token}`;
  if(f.mime.startsWith('image/')&&!f.mime.includes('svg'))return `<a href="${u}&inline=1" target="_blank" rel="noopener"><img class="fimg" loading="lazy" src="${u}&inline=1" alt="${esc(f.name)}"></a>`;
  if(f.mime.startsWith('video/'))return `<video class="fimg" controls preload="metadata" src="${u}&inline=1"></video>`;
  if(f.mime.startsWith('audio/'))return `<audio controls preload="none" src="${u}&inline=1"></audio>`;
  return `<a class="fdoc" href="${u}" download="${esc(f.name)}"><span class="fi">${ic('file',20)}</span><span class="grow"><b>${esc(f.name)}</b><small>${fmtSize(f.size)} · ${esc((f.name.split('.').pop()||'file').toUpperCase())}</small></span>${ic('down',18)}</a>`}
function msgHtml(m){
  if(m.system)return `<div class="sysm" data-id="${m.id}">${esc(m.text)}</div>`;
  const mine=m.user===S.me.id,dm=S.rinfo.kind==='dm',seen=dm&&S.peerRead>=m.id;
  const rx=Object.entries(m.reactions||{}).map(([e,us])=>`<button class="rx ${us.includes(S.me.id)?'me':''}" onclick="react(${m.id},'${e}')">${e} ${us.length}</button>`).join('');
  const body=m.deleted?`<div class="txt">${ic('x',13)} This message was deleted</div>`:`${m.reply?`<div class="quote" onclick="jump(${m.reply.id})"><b>${esc(uname(m.reply.user))}</b><span>${esc(m.reply.text)||(m.reply.file?'📎 Attachment':'')}</span></div>`:''}${fileHtml(m.file)}${m.text?`<div class="txt">${linkify(esc(m.text))}</div>`:''}`;
  return `<div class="mr ${mine?'mine':''} ${m.deleted?'del':''}" data-id="${m.id}"><div class="bub">${!mine&&!dm?`<div class="who" style="color:hsl(${hue(m.user)} 55% 38%)">${esc(uname(m.user))}</div>`:''}${body}<div class="meta">${m.edited&&!m.deleted?'edited · ':''}${hm(m.ts)}${mine&&dm&&!m.deleted?`<span class="tk ${seen?'seen':''}">${seen?'✓✓':'✓'}</span>`:''}</div>${rx?`<div class="rxs">${rx}</div>`:''}</div>
  ${m.deleted?'':`<div class="tools"><button class="pb" title="React" onclick="reactMenu(event,${m.id})">${ic('smile',16)}</button><button title="Reply" onclick="setReply(${m.id})">${ic('reply',16)}</button><button class="pb" title="More" onclick="msgMenu(event,${m.id})">${ic('more',16)}</button></div>`}</div>`}
function drawMsgs(bottom){const el=$('#msgs');if(!el)return;const keep=el.scrollHeight-el.scrollTop;let day='',h=S.more?'<button class="sm" style="align-self:center;margin:6px" onclick="older()">Load earlier messages</button>':'';
  for(const m of S.msgs){const k=dayKey(m.ts);if(k!==day){day=k;h+=`<div class="day">${dayLabel(m.ts)}</div>`}h+=msgHtml(m)}
  el.innerHTML=h||'<div class="empty">No messages yet. Say hello 👋</div>';el.scrollTop=bottom?el.scrollHeight:el.scrollHeight-keep}
async function older(){const f=S.msgs.find(m=>m.id);if(!f)return;try{const d=await api(`/rooms/${S.room}/messages?before=${f.id}`);S.more=d.messages.length>=50;S.msgs=[...d.messages,...S.msgs];drawMsgs(false)}catch(e){toast(e.message)}}
let sT;function searchRoom(q){clearTimeout(sT);sT=setTimeout(async()=>{try{const d=await api(`/rooms/${S.room}/messages?q=${enc(q)}`);S.msgs=d.messages;S.more=!q&&d.messages.length>=50;drawMsgs(!q)}catch{}},250)}
function jump(id){const e=document.querySelector(`#msgs [data-id="${id}"]`);if(e){e.scrollIntoView({block:'center'});e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1300)}else toast('Scroll up to load older messages')}
function sendChat(){const i=$('#txt');if(!i.value.trim())return;send({t:'chat',room:S.room,text:i.value,reply_to:S.replyTo?.id||null});i.value='';grow(i);setReply(null);$('#emo').innerHTML=''}
let lastTyp=0;function typingPing(){if(Date.now()-lastTyp>2500){lastTyp=Date.now();send({t:'typing',room:S.room})}}
function toggleEmo(){const e=$('#emo');e.innerHTML=e.innerHTML?'':`<div class="emo">${EMOJI.map(x=>`<button onclick="addEmo('${x}')">${x}</button>`).join('')}</div>`}
function addEmo(x){const t=$('#txt');t.value+=x;t.focus()}
function setReply(id){const m=S.msgs.find(x=>x.id===id);S.replyTo=m?{id,user:m.user,text:m.text,file:!!m.file}:null;hidePop();
  $('#rb').innerHTML=S.replyTo?`<div class="rb2"><span class="grow"><b style="color:var(--ac)">Replying to ${esc(uname(S.replyTo.user))}</b><br><small class="mut trunc" style="display:block">${esc(S.replyTo.text)||'📎 Attachment'}</small></span><button class="ib" onclick="setReply(null)">${ic('x',16)}</button></div>`:'';if(S.replyTo)$('#txt').focus()}
function reactMenu(e,id){pop(`<div class="rr" style="border:0;margin:0">${['👍','❤️','😂','😮','😢','🙏'].map(x=>`<button onclick="react(${id},'${x}')">${x}</button>`).join('')}</div>`,e)}
async function react(id,emoji){hidePop();try{await api(`/messages/${id}/react`,'POST',{emoji})}catch(e){toast(e.message)}}
function msgMenu(e,id){const m=S.msgs.find(x=>x.id===id),mine=m.user===S.me.id;
  pop(`<button onclick="setReply(${id})">${ic('reply',17)} Reply</button>${m.text?`<button onclick="copy(S.msgs.find(x=>x.id===${id}).text);hidePop()">${ic('copy',17)} Copy text</button>`:''}${m.file?`<a href="/api/files/${m.file.id}?token=${S.token}" download style="text-decoration:none;color:inherit"><button>${ic('down',17)} Download file</button></a>`:''}${mine&&m.text?`<button onclick="editMsg(${id})">${ic('edit',17)} Edit</button>`:''}<button onclick="delMsg(${id})">${ic('trash',17)} Delete</button>`,e)}
function editMsg(id){hidePop();const m=S.msgs.find(x=>x.id===id);formModal({title:'Edit message',fields:[{n:'text',l:'Message',t:'area',v:m.text,full:1}],onSubmit:async d=>{await api('/messages/'+id,'PATCH',{text:d.text});closeModal()}})}
function delMsg(id){hidePop();const m=S.msgs.find(x=>x.id===id),t=S.teams.find(x=>x.id===S.rinfo.team),canAll=m.user===S.me.id||isAdm()||t?.owner===S.me.id;
  modal(`<h2>Delete message?</h2><div style="display:grid;gap:8px;margin-top:12px"><button onclick="doDel(${id},'me')">Delete for me</button>${canAll&&!m.system?`<button class="bad" onclick="doDel(${id},'everyone')">Delete for everyone</button>`:''}<button onclick="closeModal()">Cancel</button></div>`)}
async function doDel(id,scope){closeModal();try{await api(`/messages/${id}?scope=${scope}`,'DELETE');if(scope==='me'){S.msgs=S.msgs.filter(m=>m.id!==id);drawMsgs(false)}}catch(e){toast(e.message)}}
let rT;function markRead(){clearTimeout(rT);rT=setTimeout(async()=>{if(!S.room)return;try{await api(`/rooms/${S.room}/read`,'POST');if(S.unread[S.room]){S.unread[S.room]=0;renderPanel();renderRail()}}catch{}},400)}
/* ---- uploads (stored on the server's local disk for now) ---- */
const MAX=50*1024*1024;
function pasteFiles(e){const f=[...(e.clipboardData?.files||[])];if(f.length){e.preventDefault();attachModal(f)}}
function attachModal(files){const ok=files.filter(f=>{if(f.size>MAX){toast(`${f.name} is over 50 MB`);return false}return f.size>0});if(!ok.length)return;
  window._pf=ok;modal(`<h2>Send ${ok.length} file${ok.length>1?'s':''}</h2><div class="thumbs">${ok.map(f=>`<div>${f.type.startsWith('image/')?`<img src="${URL.createObjectURL(f)}" alt="">`:`<span class="ph3">${ic('file',26)}</span>`}${esc(f.name.slice(0,22))}<br><span class="mut">${fmtSize(f.size)}</span></div>`).join('')}</div><label>Caption (optional)</label><input id="cap" maxlength="1000" onkeydown="if(event.key==='Enter')sendFiles()"><p class="mut" style="font-size:12.5px">Up to 50 MB per file. Executable file types are blocked.</p><div class="row"><button class="pri" onclick="sendFiles()">${ic('send',16)} Send</button><button onclick="closeModal()">Cancel</button></div>`);setTimeout(()=>$('#cap')?.focus(),50)}
function sendFiles(){const cap=$('#cap').value,rid=S.room,rp=S.replyTo?.id||0;closeModal();window._pf.forEach((f,i)=>uploadFile(f,i?'':cap,rid,i?0:rp));setReply(null)}
function uploadFile(file,caption,rid,reply){const u={id:Math.random().toString(36).slice(2),name:file.name,size:file.size,pct:0};S.up.push(u);drawUp();
  const x=new XMLHttpRequest();u.xhr=x;x.open('POST',`/api/rooms/${rid}/upload?name=${enc(file.name)}&mime=${enc(file.type||'application/octet-stream')}&caption=${enc(caption||'')}&reply_to=${reply||0}`);
  x.setRequestHeader('Authorization','Bearer '+S.token);x.upload.onprogress=e=>{if(e.lengthComputable){u.pct=e.loaded/e.total*100;drawUp()}};
  const done=m=>{S.up=S.up.filter(i=>i!==u);drawUp();if(m)toast(`${file.name}: ${m}`)};
  x.onload=()=>{let m='';if(x.status>=300){m='Upload failed';try{m=JSON.parse(x.responseText).detail||m}catch{}}done(m)};x.onerror=()=>done('Network error');x.onabort=()=>done('');x.send(file)}
function drawUp(){const e=$('#upl');if(e)e.innerHTML=S.up.map(u=>`<div class="upc">${ic('file',20)}<span class="grow"><b class="trunc" style="display:block">${esc(u.name)}</b><div class="pg"><i style="width:${u.pct}%"></i></div><small class="mut">${Math.round(u.pct)}% of ${fmtSize(u.size)}</small></span><button class="ib" onclick="cancelUp('${u.id}')">${ic('x',16)}</button></div>`).join('')}
function cancelUp(id){S.up.find(u=>u.id===id)?.xhr.abort()}

/* ================= WEBSOCKET ================= */
const send=o=>sock?.readyState===1&&sock.send(JSON.stringify(o));
function connect(){
  if(sock){sock.onclose=null;sock.close()}
  sock=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+S.token);
  sock.onopen=()=>{clearInterval(connect.p);connect.p=setInterval(()=>send({t:'ping'}),25000);if(S.room)send({t:'open',room:S.room})};
  sock.onclose=e=>{clearInterval(connect.p);if(e.code===4401)return logout();if(S.token)setTimeout(connect,2000)};
  sock.onmessage=ev=>onWS(JSON.parse(ev.data))}
async function onWS(m){
  if(m.t==='chat'){const g=m.msg;
    if(g.user&&!S.users.some(u=>u.id===g.user))refresh();
    if(!g.system)S.last[m.room]={text:g.text,ts:g.ts,user:g.user,file:!!g.file};
    if(m.room===S.room){S.msgs.push(g);drawMsgs(true);if(!g.system&&g.user!==S.me.id&&!document.hidden)markRead()}
    if(!g.system&&g.user!==S.me.id){
      if(m.room!==S.room)S.unread[m.room]=(S.unread[m.room]||0)+1;
      if(document.hidden&&window.Notification&&Notification.permission==='granted')new Notification(uname(g.user),{body:g.text?g.text.slice(0,100):'Sent a file'})}
    renderPanel();renderRail();if(S.sec==='dashboard')route()}
  else if(m.t==='msg_edit'){const i=S.msgs.findIndex(x=>x.id===m.msg.id);if(i>=0&&m.room===S.room){S.msgs[i]=m.msg;drawMsgs(false)}}
  else if(m.t==='msg_del'){const x=S.msgs.find(x=>x.id===m.id);if(x&&m.room===S.room){x.deleted=true;x.file=null;x.text='';x.reply=null;drawMsgs(false)}}
  else if(m.t==='cleared'&&m.room===S.room){S.msgs=[];S.more=false;drawMsgs(true);toast('This chat was cleared')}
  else if(m.t==='read'&&m.room===S.room){S.peerRead=m.last;drawMsgs(false)}
  else if(m.t==='typing'&&m.room===S.room){const t=$('#typ');if(t){t.textContent=uname(m.user)+' is typing…';clearTimeout(onWS.t);onWS.t=setTimeout(()=>t.textContent='',3000)}}
  else if(m.t==='presence'){const u=S.users.find(x=>x.id===m.user);if(u){u.online=m.online;renderPanel();if(S.rinfo)drawChatHead();if(S.sec==='people')drawDir()}}
  else if(m.t==='refresh'){await refresh()}
  else if(m.t==='reminder'){const x=m.meeting;notify('Meeting starts soon',`${x.title} · ${mWhen(x)}`,[{label:'Join',pri:1,fn:()=>joinMeeting(x.id)},{label:'Details',fn:()=>{refresh().then(()=>meetingInfo(x.id))}}],90000);refresh()}
  else if(m.t==='call_state'){S.counts[m.room]=m.count;if(m.room===S.room)drawChatHead()}
  else if(m.t==='ring')ringModal(m);
  else if(m.t==='error')toast(m.msg)}
function ringModal(m){const vid=m.kind==='meeting';
  if(cb||locked){notify(uname(m.from)+' is calling',`${m.title} · you are already in a call`,[{label:'Open chat',fn:()=>go('#/chats/'+m.room)}]);return}
  modal(`<div style="text-align:center">${av(uname(m.from),m.from,72)}<h2 style="margin-top:12px">${esc(uname(m.from))} is calling</h2><p class="mut">${vid?'Video meeting':'Voice call'} · ${esc(m.title)}</p><div class="row" style="justify-content:center"><button class="pri" id="acc">${ic(vid?'video':'phone',17)} Join</button><button id="dec">Decline</button></div></div>`);
  $('#acc').onclick=()=>{closeModal();joinCall(m.room,false)};$('#dec').onclick=closeModal;setTimeout(()=>{if($('#dec'))closeModal()},30000)}

/* ================= CALLS open in their own full-screen page (/call/<id>); this tab keeps chatting ================= */
const bc=window.BroadcastChannel?new BroadcastChannel('meetly-call'):{postMessage(){},set onmessage(f){}};   // very old browsers: windows just do not talk to each other
let cb=null;                // cb = live call reported by the call window
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s%60).padStart(2,'0')};
bc.onmessage=e=>{const m=e.data||{};if(m.k==='state'&&m.live){const first=!cb||cb.room!==m.room||cb.muted!==m.muted;cb={...m,seen:Date.now()};if(first)drawMini()}else if(m.k==='ended'){cb=null;drawMini()}};
setInterval(()=>{if(cb&&Date.now()-cb.seen>7000){cb=null;drawMini()}else if(cb){const t=$('#mt');if(t)t.textContent=clock(Date.now()-cb.since)}},1000);
const callCmd=cmd=>bc.postMessage({k:'cmd',cmd});
const leaveCall=()=>callCmd('leave');
function drawMini(){const m=$('#mini');if(!m)return;
  if(!cb){m.hidden=true;m.innerHTML=''}else{m.hidden=false;m.innerHTML=`<span class="dotl"></span><span><b class="trunc" style="display:block;max-width:170px">${esc(cb.title)}</b><small id="mt" style="color:#9aa6c4">${clock(Date.now()-cb.since)}</small></span><button class="ib mb ${cb.muted?'off':''}" title="Mute or unmute" onclick="callCmd('mute')">${ic(cb.muted?'micoff':'mic',18)}</button><button class="ib mb" title="Return to the call window" onclick="openCallWindow('${cb.room}')">${ic('min',18)}</button><button class="ib mb bad" title="Leave call" onclick="callCmd('leave')">${ic('phone',18)}</button>`}
  if(S.rinfo)drawChatHead()}
function openCallWindow(rid,ring){
  const url='/call/'+rid+(ring?'?ring=1':'');let w=null;try{w=window.open('','meetly-call')}catch{}
  if(!w){toast('Popup blocked. Opening the call in this tab.');location.href=url;return}
  let path='';try{path=w.location.pathname}catch{}
  if(!cb||!path.startsWith('/call/'))w.location.href=url;else if(cb.room!==rid)toast('You are already in another call. Leave it first.');
  try{w.focus()}catch{}}
function joinCall(rid,ring){openCallWindow(rid,ring)}


</script>
